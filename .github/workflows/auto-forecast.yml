name: Update All TC Forecast Plots

on:
  push:
    paths:
      - 'forecast_track_*.csv'
      - 'tc_config.json'
  workflow_dispatch: 

jobs:
  build-and-plot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas numpy matplotlib scipy shapely cartopy tcmarkers

    - name: Install Chinese Fonts
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-wqy-microhei

    - name: Run plot script
      run: python plot_all_tc.py

    - name: Commit and push updated plots
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add output/*.png
        if ! git diff --cached --quiet; then
          git commit -m "chore: auto-update all TC forecast plots [skip ci]"
          git push
        else
          echo "No changes to commit"
        fi
