name: Update All TC Forecast Plots

on:
  push:
    paths:
      - 'forecast_track_*.csv'
      - 'notice_*.txt'
      - 'notice.txt'
      - 'tc_config.json'
  workflow_dispatch: 

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-plot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Get changed files
      run: |
        if [ "${{ github.event_name }}" == "push" ]; then
          git show --pretty="" --name-only ${{ github.sha }} > changed_files.txt
          echo "📁 本次修改的檔案清單："
          cat changed_files.txt
        else
          echo "manual" > changed_files.txt
          echo "👆 手動觸發，強制發送。"
        fi

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas numpy matplotlib scipy shapely cartopy tcmarkers

    - name: Install Chinese Fonts
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-wqy-microhei

    - name: Run plot script
      run: python plot_all_tc.py

    - name: Commit and push updated plots
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add output/*.png
        
        if ! git diff --cached --quiet; then
          git fetch origin main
          git reset --soft origin/main
          git add output/*.png
          git commit -m "chore: auto-update all TC forecast plots [skip ci]"
          git push
        else
          echo "No changes to commit"
        fi

    # 🌟 真正的超級除錯版 Telegram 發送
    - name: Send TC forecast to Telegram
      env:
        BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.TELEGRAM_TO }}
      run: |
        cat << 'EOF' > send_tg.py
        import requests, json, os, sys
        
        token = os.environ['BOT_TOKEN']
        chat_id = os.environ['CHAT_ID']
        
        with open('changed_files.txt', 'r') as f:
            changed_files = [line.strip() for line in f if line.strip()]
            
        is_manual = 'manual' in changed_files
        
        with open('tc_config.json', 'r', encoding='utf-8-sig') as f:
            tc_list = json.load(f)
            
        for tc in tc_list:
            tc_id = tc['id']
            image_path = f'output/forecast_{tc_id}.png'
            notice_path = f'notice_{tc_id}.txt'
            csv_path = f'forecast_track_{tc_id}.csv'
            generic_notice = 'notice.txt'
            
            need_send = is_manual
            if not need_send:
                if csv_path in changed_files or notice_path in changed_files or generic_notice in changed_files:
                    need_send = True
            
            if not need_send:
                print(f'[{tc_id}] 判斷 CSV 或 TXT 無更新，跳過發送。')
                continue
                
            if not os.path.exists(image_path):
                print(f'❌ [{tc_id}] 找不到圖片 {image_path}，中斷程式！')
                sys.exit(1) # 🔥 強制報錯
                
            caption = ''
            if os.path.exists(notice_path):
                with open(notice_path, 'r', encoding='utf-8') as nf:
                    caption = nf.read()
            elif os.path.exists('notice.txt'):
                with open('notice.txt', 'r', encoding='utf-8') as nf:
                    caption = nf.read()
            
            if len(caption) > 1000:
                caption = caption[:1000] + '\n...(內容過長已截斷)'
                    
            url = f'https://api.telegram.org/bot{token}/sendPhoto'
            with open(image_path, 'rb') as photo:
                files = {'photo': photo}
                data = {'chat_id': chat_id, 'caption': caption}
                print(f'🚀 [{tc_id}] 正在發送到 Telegram (目標: {chat_id})...')
                resp = requests.post(url, files=files, data=data)
                
                if resp.status_code != 200:
                    print(f'❌ [{tc_id}] Telegram 拒絕發送！狀態碼: {resp.status_code}')
                    print(f'📄 錯誤詳情: {resp.text}')
                    sys.exit(1) # 🔥 強制報錯
                else:
                    print(f'✅ [{tc_id}] Telegram 發送成功！')
        EOF
        python send_tg.py